<div class="page-title">Community News</div>
<!-- Empty state -->
<div *ngIf="news().length === 0" class="news-empty">
	There are currently no recent news items.
</div>
<!-- News items -->
<div class="news-item" *ngFor="let item of news()">
	<div class="news-headline">
		<a *ngIf="item.link" [href]="item.link" target="_blank">
			{{ item.headline }}
		</a>
		<span *ngIf="!item.link">
			{{ item.headline }}
		</span>
	</div>
	<div class="new-description">
		{{ item.description }}
	</div>
	<div class="news-date">
		{{ item.date | date:'MMMM d, y' }}
	</div>
</div>
