<div class="page-title">Community Calendar</div>
<nz-calendar [nzDateCell]="dateCell">
  <ng-template #dateCell let-date>
    <ul class="events">
      @for (event of getEventsForDate(date); track event.title) {
        <li>
          <strong>{{ event.title }}</strong><br>
          <div class="location">{{ event.location }}</div>
          <div class="time">
            <span>
              {{ event.startDate | date:'h:mm a':'America/New_York' }}
              –
              {{ event.endDate | date:'h:mm a':'America/New_York' }}
            </span>
          </div>
        </li>
      }
    </ul>
  </ng-template>
</nz-calendar>
