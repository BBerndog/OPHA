<h2>Mailbox Replacement</h2>
<p>Replace your mailbox with a community-approved style and size. All new mailboxes must match Oak Park HOA design standards.</p>
<ul>
  <li>Mailboxes must be black or dark brown</li>
  <li>Height must be 40&quot; to 48&quot; from ground level</li>
  <li>Post must be pressure-treated wood or metal</li>
</ul>
